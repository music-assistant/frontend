name: Test and Lint Vue frontend
on:
  # pull_request covers PR branches, so push only needs to catch commits
  # landing directly on main - otherwise every PR runs the suite twice.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for a ref instead of running them to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checking out the code is all this workflow needs.
permissions:
  contents: read

env:
  NODE_VERSION: "22.x" # set this to the node version to use

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.8.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Run tests
        run: pnpm test:run
        env:
          CI: true

      - name: Lint
        run: pnpm lint:check
        env:
          CI: true

      - name: Build
        run: pnpm build
        env:
          CI: true

      # disable typecheck for now
      # - name: Typecheck
      #   run: pnpm typecheck
      #   env:
      #     CI: true
