name: Test and Lint Vue frontend
on:
  # pull_request covers PR branches, so push only needs to catch commits
  # landing directly on main - otherwise every PR runs the suite twice.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for a ref instead of running them to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checking out the code is all this workflow needs.
permissions:
  contents: read

env:
  NODE_VERSION: "22.x" # set this to the node version to use
  PYTHON_VERSION: "3.12" # set this to the python version to use

jobs:
  test:
    name: Test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests
        run: pnpm test:run --shard=${{ matrix.shard }}/4
        env:
          CI: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: pnpm lint:check
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python build tools
        run: python3 -m pip install build

      - name: Build
        run: pnpm build
        env:
          CI: true

      # The Python package wraps the freshly built frontend, so this has to run
      # after `pnpm build`. Nothing else exercises the packaging config, so
      # without this a mistake in pyproject.toml or MANIFEST.in first shows up
      # as a failed release.
      - name: Build Python package
        run: python3 -m build

      - name: Verify the Python package ships the frontend
        run: .github/scripts/verify-python-package.sh

  # Keeps the "Test and Lint" check name that branch protection requires,
  # and fails unless every job above passed.
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: always()
    steps:
      - name: Check job results
        run: |
          [ "${{ needs.test.result }}" = "success" ] &&
          [ "${{ needs.lint.result }}" = "success" ] &&
          [ "${{ needs.build.result }}" = "success" ]
