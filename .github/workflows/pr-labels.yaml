---
name: PR Labels

# Each PR must carry exactly one of the labels the release-notes
# generator knows how to slot into a section. We derive that label
# from the "Types of changes" checkbox in the PR template and apply
# it automatically — most external contributors can't label their
# own PRs. The Verify job fails when more than one box is ticked, or
# when none is and the PR doesn't already carry a single known label.
#
# Verify runs on the pull request itself, without write access. The
# Apply job runs from `main` after the "PR event" workflow and reads the
# pull request through the API, so pull requests from forks get their
# label as well.

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
      - reopened
      - ready_for_review
    branches:
      - main
  workflow_run:
    workflows: [PR event]
    types: [completed]

permissions: {}

jobs:
  # The job name is the context of the required status check on the
  # protect-main ruleset, so renaming it leaves that check waiting on
  # a report that never arrives, blocking every PR.
  pr_labels:
    name: Verify
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    # One run at a time per PR, so the check ends on the result of the latest event.
    concurrency:
      group: pr-labels-verify-${{ github.event.pull_request.number }}
    steps:
      - name: ⤵️ Check out the label rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 🏷 Check the "Types of changes" checkbox
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;

            // GitHub-typed bots (Dependabot, musicassistant-bot[bot],
            // etc.) don't follow the PR template and apply their own
            // labels. Bail out from inside the script rather than with
            // a job-level `if`: this job is a required status check,
            // and a real success is unambiguous where a skipped job
            // would leave the merge gate depending on how GitHub
            // reports it.
            if (pr.user.type === 'Bot') {
              core.info(`Skipping: PR opened by bot '${pr.user.login}'.`);
              return;
            }

            const { chooseLabel } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-labels.cjs`);
            const result = chooseLabel(pr);
            if (result.error) {
              core.setFailed(result.error);
            }

  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    permissions:
      contents: read
      pull-requests: write
    # Overlapping runs for the same PR can each read a label set the
    # other is about to change and leave a stale label behind, so they
    # run one at a time.
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{
        github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: ⤵️ Check out the label rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 🏷 Apply label from PR description checkbox
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const dir = `${process.env.GITHUB_WORKSPACE}/.github/scripts`;
            const { findPullRequest } = require(`${dir}/pr-event.cjs`);
            const { KNOWN, chooseLabel } = require(`${dir}/pr-labels.cjs`);

            // A PR merged right after opening still gets its label.
            const pr = await findPullRequest({ github, context, core, base: 'main' })
              ?? await findPullRequest({ github, context, core, base: 'main', state: 'closed' });
            if (!pr || pr.user.type === 'Bot') {
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const current = pr.labels.map(l => l.name);
            const { label } = chooseLabel(pr);
            if (!label) {
              return;
            }

            // Strip any stale labels from the known set so a
            // contributor changing their mind in the description
            // doesn't leave the previous label behind.
            for (const name of current) {
              if (KNOWN.includes(name) && name !== label) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number, name,
                }).catch(() => {});
              }
            }
            if (!current.includes(label)) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: [label],
              });
            }
