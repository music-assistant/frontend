name: Sync shared-icons

# The receiver half of the icon sync, triggered by shared-icons release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "shared-icons release tag to sync (e.g. 0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"

jobs:
  sync:
    name: Sync and open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      # The tag goes through env so it is never expanded into the script itself.
      - name: Sync shared-icons
        run: pnpm sync:shared-icons "$TAG"
        env:
          TAG: ${{ inputs.tag }}

      - name: Create app token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get release notes
        id: release_notes
        run: |
          # shared-icons is public, so the default token can read its releases.
          # A tag without a GitHub release just yields empty notes.
          NOTES=$(gh release view "$TAG" \
            --repo music-assistant/shared-icons --json body --jq '.body' 2>/dev/null || true)
          # Random delimiter so a note line reading "EOF" cannot cut the output short.
          DELIM="$(openssl rand -hex 16)"
          {
            echo "notes<<$DELIM"
            echo "$NOTES"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app_token.outputs.token }}
          commit-message: "⬆️ Sync shared-icons to ${{ inputs.tag }}"
          sign-commits: true
          branch: "auto-update-shared-icons-${{ inputs.tag }}"
          base: main
          delete-branch: true
          title: "⬆️ Sync shared-icons to ${{ inputs.tag }}"
          # pr-labels.yaml skips bot PRs, so the label is applied here.
          labels: |
            dependencies
          body: |
            Sync vendored icons to shared-icons [${{ inputs.tag }}](https://github.com/music-assistant/shared-icons/releases/tag/${{ inputs.tag }}).

            ${{ steps.release_notes.outputs.notes }}
