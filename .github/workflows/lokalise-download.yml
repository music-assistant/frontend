name: Download Lokalise translations
on: 
  schedule:
    - cron: "0 2 * * 2"

# Pushing the translations branch needs contents, opening the PR needs pull-requests.
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lokalise CLI
        env:
          LOKALISE_VERSION: "3.1.7"
          LOKALISE_SHA256: "3dc94825c6ff7b8300399d025a7bf8460463ac91d9bf92d08409ebdbc1baaea2"
        run: |
          ARCHIVE="$RUNNER_TEMP/lokalise2.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/lokalise/lokalise-cli-2-go/releases/download/v${LOKALISE_VERSION}/lokalise2_linux_x86_64.tar.gz" \
            --output "$ARCHIVE"
          echo "${LOKALISE_SHA256}  ${ARCHIVE}" | sha256sum --check
          mkdir -p bin
          tar -xzf "$ARCHIVE" -C bin lokalise2
      - name: Pull
        env: 
          VAR_LOKALISE_API_TOKEN: ${{ secrets.LOKALISE_RO_API_TOKEN }}
          VAR_LOKALISE_PROJECT_ID: ${{ secrets.LOKALISE_PROJECT_ID }}
          VAR_LANGUAGES: bg_BG,zh_CN,zh_TW,cs,da,nl,en_au,en_GB,fr,de,el_GR,hu_HU,it,ko_KR,lt_LT,lv_LV,nb,pl,pt_BR,pt_PT,ru_RU,sl_SI,sr,sr_Latn,es,sv_SE,uk_UA
        run: |
            ./bin/lokalise2 --token ${{ env.VAR_LOKALISE_API_TOKEN }} --project-id ${{ env.VAR_LOKALISE_PROJECT_ID }} file download --filter-langs ${{ env.VAR_LANGUAGES }} --format json --export-empty-as skip --export-sort first_added --placeholder-format printf --plural-format array --indentation 4sp --directory-prefix src/translations --replace-breaks=false --async
      - name: Create Pull Request
        env: 
          GH_TOKEN: ${{ github.token }}
          GITHUB_NEW_BRANCH_NAME: Lokalise-${{ github.run_id }}${{ github.run_attempt }}
        run: |
             git checkout -b ${{ env.GITHUB_NEW_BRANCH_NAME }}
             git config --global user.name "${GITHUB_ACTOR}"
             git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
             git add ./\*.json
             if [[ -z $(git status --untracked-files=no --porcelain) ]]
             then
              echo "No changes"
             else
              git commit -m 'Translations update'
              git push --set-upstream origin ${{ env.GITHUB_NEW_BRANCH_NAME }}
              gh pr create --base main --head ${{ env.GITHUB_NEW_BRANCH_NAME }} --title "Lokalise translations update" --body ""
             fi
